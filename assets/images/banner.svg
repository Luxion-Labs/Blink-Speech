<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#061325" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="iris-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <pattern id="hud-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" />
  <rect width="1200" height="420" fill="url(#iris-glow)" />
  <rect width="1200" height="420" fill="url(#hud-grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.18" />

  <!-- Biometric HUD Eye Graphic (Right Side) -->
  <g transform="translate(820, 210)">
    <!-- Outer Eye Contours -->
    <path d="M -170 0 Q 0 -110 170 0 Q 0 110 -170 0 Z" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M -150 0 Q 0 -85 150 0 Q 0 85 -150 0 Z" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Iris & Pupil Reticles -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.8" />
    <circle cx="0" cy="0" r="45" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="2" />
    <circle cx="0" cy="0" r="22" fill="#030712" stroke="#38BDF8" stroke-width="3" />
    <circle cx="-7" cy="-7" r="5" fill="#FFFFFF" />

    <!-- HUD Crosshairs & Coordinates -->
    <line x1="-190" y1="0" x2="-160" y2="0" stroke="#10B981" stroke-width="2" stroke-opacity="0.8" />
    <line x1="160" y1="0" x2="190" y2="0" stroke="#10B981" stroke-width="2" stroke-opacity="0.8" />
    <line x1="0" y1="-120" x2="0" y2="-95" stroke="#10B981" stroke-width="2" stroke-opacity="0.8" />
    <line x1="0" y1="95" x2="0" y2="120" stroke="#10B981" stroke-width="2" stroke-opacity="0.8" />

    <!-- Corner HUD Brackets -->
    <path d="M -90 -90 L -70 -90 M -90 -90 L -90 -70" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.6" />
    <path d="M 90 -90 L 70 -90 M 90 -90 L 90 -70" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.6" />
    <path d="M -90 90 L -70 90 M -90 90 L -90 70" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.6" />
    <path d="M 90 90 L 70 90 M 90 90 L 90 70" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.6" />

    <!-- Waveform Audio Output from Eye -->
    <g transform="translate(-80, 140)">
      <rect x="0" y="-10" width="3" height="20" rx="1.5" fill="#10B981" />
      <rect x="8" y="-18" width="3" height="36" rx="1.5" fill="#06B6D4" />
      <rect x="16" y="-26" width="3" height="52" rx="1.5" fill="#38BDF8" />
      <rect x="24" y="-14" width="3" height="28" rx="1.5" fill="#10B981" />
      <rect x="32" y="-32" width="3" height="64" rx="1.5" fill="#06B6D4" />
      <rect x="40" y="-22" width="3" height="44" rx="1.5" fill="#38BDF8" />
      <rect x="48" y="-8" width="3" height="16" rx="1.5" fill="#10B981" />
      <rect x="56" y="-16" width="3" height="32" rx="1.5" fill="#06B6D4" />
      <rect x="64" y="-28" width="3" height="56" rx="1.5" fill="#38BDF8" />
      <rect x="72" y="-12" width="3" height="24" rx="1.5" fill="#10B981" />
    </g>
    <text x="-80" y="170" fill="#64748B" font-family="'SF Mono', monospace" font-size="10" letter-spacing="1">SYNTHESIZING: VOCAL_PACKET_01</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <!-- Tag Pill -->
    <rect width="240" height="30" rx="15" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#10B981" />
    <text x="28" y="19" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ASSISTIVE COMPUTER VISION</text>

    <!-- Title -->
    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Blink Speech
    </text>

    <!-- Accent bar -->
    <rect x="0" y="105" width="90" height="4" rx="2" fill="url(#emerald-cyan)" />

    <!-- Subtitle -->
    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Turning eye blink patterns and gaze gestures into real-time spoken voice.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Client-side neural gaze estimation with zero cloud latency or server data leakage.
    </text>

    <!-- Specs Pills -->
    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">STACK: MEDIAPIPE + TS</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">PRIVACY: 100% LOCAL</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>